
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d16">
    <meta name="description" content="Play Noughts and Crosses on Bitfogav.com">
    <title>Noughts and Crosses | Bitfogav</title>

    <style>
        :root {
            --bg: #090d16;
            --panel: #121a29;
            --cyan: #00e5ff;
            --purple: #a36bff;
            --text: #eef4ff;
            --muted: #97a6bd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse at 15% 20%,
                    rgba(0,229,255,0.12), transparent 45%),
                radial-gradient(ellipse at 85% 75%,
                    rgba(163,107,255,0.14), transparent 45%),
                #090d16;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.15;
            background-image:
                linear-gradient(rgba(0,229,255,0.2) 1px,
                    transparent 1px),
                linear-gradient(90deg,
                    rgba(0,229,255,0.2) 1px,
                    transparent 1px);
            background-size: 60px 60px;
            mask-image: linear-gradient(
                to bottom, transparent, black 70%);
            pointer-events: none;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 7%;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--text);
            text-decoration: none;
        }

        .logo span {
            color: var(--cyan);
        }

        .back {
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back:hover {
            color: var(--cyan);
        }

        main {
            width: 100%;
            max-width: 1150px;
            margin: auto;
            padding: 70px 24px;
            flex: 1;
        }

        .eyebrow {
            color: var(--cyan);
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(40px, 7vw, 70px);
            letter-spacing: -2px;
            margin: 20px 0;
        }

        h1 span {
            background: linear-gradient(
                90deg, var(--cyan), var(--purple));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .intro {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .game-panel {
            display: inline-block;
            padding: 35px;
            background: rgba(18,26,41,0.85);
            border: 1px solid rgba(0,229,255,0.18);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .game-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(
                90deg, var(--cyan), var(--purple));
        }

        /* Original game board structure preserved */
        .row {
            clear: both;
        }

        .row:not(.resetBtn) {
            display: flex;
        }

        .row:not(.resetBtn) div {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 85px;
            height: 85px;
            border: 1px solid rgba(0,229,255,0.3);
            background: rgba(9,13,22,0.9);
            color: var(--cyan);
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .row:not(.resetBtn) div:hover {
            background: rgba(0,229,255,0.08);
            box-shadow: inset 0 0 20px rgba(0,229,255,0.08);
        }

        .row:not(.resetBtn) div:empty {
            color: var(--purple);
        }

        .resetBtn {
            padding-top: 25px;
            text-align: center;
        }

        .resetBtn button {
            padding: 13px 35px;
            border: 1px solid rgba(0,229,255,0.45);
            border-radius: 8px;
            background: transparent;
            color: var(--cyan);
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .resetBtn button:hover {
            background: rgba(0,229,255,0.1);
            box-shadow: 0 0 25px rgba(0,229,255,0.12);
        }

        .resetBtn button:focus-visible,
        .back:focus-visible,
        .logo:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 4px;
        }

        footer {
            padding: 30px 7%;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }

        .content {
            animation: fadeUp 0.8s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 22px 6%;
            }

            .logo {
                font-size: 19px;
            }

            main {
                padding: 55px 22px;
            }

            .game-panel {
                padding: 20px;
            }

            .row:not(.resetBtn) div {
                width: 75px;
                height: 75px;
                font-size: 36px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            BITFO<span>GAV</span>
        </a>

        <a href="gameList.html" class="back">
            ← Back to Games
        </a>
    </header>

    <main>
        <div class="content">
            <div class="eyebrow">// Classic strategy game</div>

            <h1>
                Noughts <span>& Crosses.</span>
            </h1>

            <p class="intro">
                Click a square to place your mark.
                Take turns and get three in a row to win.
            </p>

            <div class="game-panel">
                <div class="row">
                    <div id="0_0" onclick="place(this)"></div>
                    <div id="1_0" onclick="place(this)"></div>
                    <div id="2_0" onclick="place(this)"></div>
                </div>
                <div class="row">
                    <div id="0_1" onclick="place(this)"></div>
                    <div id="1_1" onclick="place(this)"></div>
                    <div id="2_1" onclick="place(this)"></div>
                </div>
                <div class="row">
                    <div id="0_2" onclick="place(this)"></div>
                    <div id="1_2" onclick="place(this)"></div>
                    <div id="2_2" onclick="place(this)"></div>
                </div>
                <div class="row resetBtn">
                    <button onclick="reset()">Reset Game</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        © <span id="year"></span> Bitfogav.com
        — Built with curiosity.
    </footer>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>

    <!-- ORIGINAL GAME JAVASCRIPT - UNCHANGED -->
    <script>
      var currentPlayer = "O";
        var won = false;

        function place(box) {
            if(box.innerText != "" || won) return;
            box.innerText = currentPlayer;
            currentPlayer == "O" ? currentPlayer = "X" : currentPlayer = "O";
            checkGameBoard();
        }

        function checkGameBoard() {
            for(var i = 0; i <= 2; i++) {
                checkWinner(document.getElementById(i + "_0").innerText,
                    document.getElementById(i + "_1").innerText,
                    document.getElementById(i + "_2").innerText);
                checkWinner(document.getElementById("0_" + i).innerText,
                    document.getElementById("1_" + i).innerText,
                    document.getElementById("2_" + i).innerText);
            }
                checkWinner(document.getElementById("0_0").innerText,
                    document.getElementById("1_1").innerText,
                    document.getElementById("2_2").innerText);
                checkWinner(document.getElementById("0_2").innerText,
                    document.getElementById("1_1").innerText,
                    document.getElementById("2_0").innerText);

        }

        function checkWinner(first, second, third) {
            if(first != "" && first == second && first == third) {
                alert("Winner!");
                won = true;
            }
        }

        function reset() {
            won = false;

            for(var i = 0; i <= 2; i++) {
                    document.getElementById(i + "_0").innerText = "";
                    document.getElementById(i + "_1").innerText = "";
                    document.getElementById(i + "_2").innerText = "";
            }
        }
    </script>

</body>
</html>
